name: VidGrid
description: >-
  VidGrid is an enterprise video platform for recording, hosting, captioning, and
  sharing interactive video, acquired by Paylocity and now branded VidGrid by
  Paylocity. Its Content Management API v2 is a JSON REST API for managing videos,
  captions, folders, users, and search on an account, plus record/upload tokens that
  launch the embeddable screen recorder and uploader, with webhook events for video
  and caption processing. API keys are Enterprise-restricted after a 14-day trial.
